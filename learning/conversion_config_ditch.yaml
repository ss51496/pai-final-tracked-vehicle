# 壕の rosbag2 → LeRobotDataset の変換設定（rosbag2lerobot_tank.py --config で指定する）。デモは --use-sim-time で記録するので fps は 10
bag_dir: "/workspace/dataset/rosbags/ditch"          # ep0, ep1, ... のフォルダが入っている場所
output_dir: "/workspace/dataset/lerobot_dataset/tank_ditch"
features_file: "/workspace/learning/tank_features_ditch.py"
fps: 10                                             # まず 10 から始める
state_topic: "/tank/state"                          # Float32MultiArray（5 次元）
action_topic: "/tank/command"                       # Float32MultiArray（3 次元）
trim_idle: true                                     # 操縦の前後の停止区間を切り詰める
trim_tail_sec: 1.0                                  # 最後の操作のあとに残す秒数
