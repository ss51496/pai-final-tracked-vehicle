# ros_gz_bridge のトピック対応表。launch ファイルがこれを読んで parameter_bridge の引数に展開する
# （この環境の ros_gz_bridge は config_file パラメータに非対応のため）
# direction: ros_to_gz | gz_to_ros
- topic: /cmd_vel
  ros_type: geometry_msgs/msg/Twist
  gz_type: ignition.msgs.Twist
  direction: ros_to_gz

- topic: /tank/turret_cmd
  ros_type: std_msgs/msg/Float64
  gz_type: ignition.msgs.Double
  direction: ros_to_gz

- topic: /odom
  ros_type: nav_msgs/msg/Odometry
  gz_type: ignition.msgs.Odometry
  direction: gz_to_ros

# 真値の位置姿勢（OdometryPublisher、world 座標）。
# PosePublisher はリンクの相対姿勢しか出さず、pose/info は bridge で名前が失われるため使わない
- topic: /odom_gt
  ros_type: nav_msgs/msg/Odometry
  gz_type: ignition.msgs.Odometry
  direction: gz_to_ros

- topic: /imu
  ros_type: sensor_msgs/msg/Imu
  gz_type: ignition.msgs.IMU
  direction: gz_to_ros

- topic: /joint_states
  ros_type: sensor_msgs/msg/JointState
  gz_type: ignition.msgs.Model
  direction: gz_to_ros

- topic: /clock
  ros_type: rosgraph_msgs/msg/Clock
  gz_type: ignition.msgs.Clock
  direction: gz_to_ros

# 砲身の接触（ContactSensor）。モデルの <topic> 指定は無視され、Gazebo のトピック名はこの固定の名前になる
# （world 名を course に統一しているので全 world で共通）。接触が起きたときだけ配信される
- topic: /world/course/model/tank/link/turret/sensor/barrel_contact/contact
  ros_type: ros_gz_interfaces/msg/Contacts
  gz_type: ignition.msgs.Contacts
  direction: gz_to_ros

# 車体（ハル）の接触。壕の壁への激突を数える（トピック名は砲身の接触センサーと同じ理由で固定）
- topic: /world/course/model/tank/link/base_link/sensor/hull_contact/contact
  ros_type: ros_gz_interfaces/msg/Contacts
  gz_type: ignition.msgs.Contacts
  direction: gz_to_ros

# 前方カメラの画像（tank_v2_cam のときだけ配信される。無ければ bridge は待つだけ）
- topic: /camera/image
  ros_type: sensor_msgs/msg/Image
  gz_type: ignition.msgs.Image
  direction: gz_to_ros
